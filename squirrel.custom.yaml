# 由「鼠须管设置助手」生成,可直接在 App 中修改
patch:
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/inline_preedit: true
  style/inline_candidate: true
  style/translucency: true
  style/show_paging: false
  style/memorize_size: true
  style/font_point: 15
  style/corner_radius: 7
  style/hilited_corner_radius: 0
  style/border_height: -2
  style/border_width: -2
  style/line_spacing: 5
  style/spacing: 8
  style/shadow_size: 2
  style/color_scheme: wechat_light
  style/color_scheme_dark: wechat_light
  preset_color_schemes:
    wechat_light:
      name: 微信浅色
      author: 徐小颖
      back_color: 0xFFFFFF
      border_color: 0xE0E0E0
      text_color: 0x424242
      hilited_text_color: 0x956B57
      hilited_back_color: 0xFFFFFF
      candidate_text_color: 0x424242
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0x956B57
      comment_text_color: 0x9A9A9A
      hilited_comment_text_color: 0xE0E0E0
