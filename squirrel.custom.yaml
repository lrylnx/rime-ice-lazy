# 鼠须管外观配置 —— 微信风格浅色主题，横排候选
# 注意：Squirrel 1.0.1 起 style/horizontal 已废弃，改用 candidate_list_layout
patch:
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/color_scheme: wechat_light
  style/color_scheme_dark: wechat_light
  style/font_point: 15
  style/corner_radius: 7
  style/border_height: -2
  style/border_width: -2
  style/line_spacing: 5
  preset_color_schemes:
    wechat_light:
      name: 微信浅色
      author: 徐小颖
      back_color: 0xFFFFFF                      # 背景 白
      border_color: 0xE0E0E0                    # 边框 浅灰
      text_color: 0x424242                      # 拼音串 深灰
      hilited_text_color: 0x956B57              # 高亮拼音 微信蓝(Rime 用 0xBBGGRR)
      hilited_back_color: 0xFFFFFF
      candidate_text_color: 0x424242            # 候选词 深灰
      hilited_candidate_text_color: 0xFFFFFF    # 选中候选 白字
      hilited_candidate_back_color: 0x956B57    # 选中候选 蓝底
      comment_text_color: 0x9A9A9A              # 注释 灰
      hilited_comment_text_color: 0xE0E0E0
